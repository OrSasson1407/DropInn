name: DropIn v2 CI/CD & Security Rules Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Build, Lint & Full Test Suite (Unit, Integration, E2E, Rules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Frontend Dependencies
        run: cd frontend && npm install

      - name: Lint Codebase & Build Validation
        run: npm run lint

      - name: Firestore Rules Lint & Structure Validation
        run: |
          if [ -f firestore.rules ]; then
            echo "Linting firestore.rules structure..."
            grep -q "rules_version = '2';" firestore.rules || (echo "Error: Missing rules_version = '2'" && exit 1)
            grep -q "service cloud.firestore" firestore.rules || (echo "Error: Missing service cloud.firestore declaration" && exit 1)
            grep -q "match /databases/{database}/documents" firestore.rules || (echo "Error: Missing documents root match block" && exit 1)
            echo "firestore.rules lint check passed successfully!"
          else
            echo "Error: firestore.rules file not found!" && exit 1
          fi

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Security Rules Tests
        run: npm run test:rules

      - name: Install Playwright Browsers for E2E
        run: npx playwright install --with-deps || true

      - name: Run E2E Tests
        run: npm run test:e2e || true
